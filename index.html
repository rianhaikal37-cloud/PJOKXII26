<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>UAS Ganjil PJOK Kelas XII</title>
<style>
:root{--bg:#f1f4ff;--card:#fff;--tx:#1b2037;--mu:#5d6585;--bd:#dde2f5;--p:#5b3df5;--p2:#00b3a4;--ok:#16a34a;--rg:#f59e0b;--no:#dc2626;--gr:#cfd5e8;--soft:#eef0ff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#10132a;--card:#1a1e3a;--tx:#eceffd;--mu:#a5aed4;--bd:#2d3359;--p:#8b78ff;--p2:#2dd4c4;--gr:#3a4170;--soft:#252a52;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#10132a;--card:#1a1e3a;--tx:#eceffd;--mu:#a5aed4;--bd:#2d3359;--p:#8b78ff;--p2:#2dd4c4;--gr:#3a4170;--soft:#252a52;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
body.ex{-webkit-user-select:none;user-select:none}
.hero{background:linear-gradient(135deg,#5b3df5,#00b3a4);color:#fff;padding:26px 16px 40px;text-align:center}
.hero h1{margin:0;font-size:1.6rem}.hero p{margin:.3em 0 0;opacity:.92}
main{max-width:900px;margin:0 auto;padding:0 14px 30px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:18px;margin:14px 0;box-shadow:0 4px 14px rgba(91,61,245,.08)}
.hero+main .card:first-child{margin-top:-24px}
label{display:block;font-weight:600;font-size:.9rem;margin-top:10px}
input{width:100%;padding:11px;border:1px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--tx);font:inherit;margin-top:4px}
button{border:0;border-radius:12px;padding:12px 18px;font:inherit;font-weight:700;cursor:pointer;color:#fff;background:linear-gradient(135deg,var(--p),#7c5cff)}
button.rg{background:var(--rg);color:#2b1d00}button.rg.on{background:#b45309;color:#fff}
button.sc{background:var(--soft);color:var(--p)}button.fin{background:linear-gradient(135deg,var(--p2),#0891b2)}
button:disabled{opacity:.4;cursor:default}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--card);border-bottom:1px solid var(--bd);padding:10px 14px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.top small{color:var(--mu);display:block;line-height:1.2}
.tm{font-size:1.25rem;font-weight:800;color:var(--p);font-variant-numeric:tabular-nums;background:var(--soft);padding:6px 12px;border-radius:10px}.tm.low{color:#fff;background:var(--no)}
.layout{display:grid;grid-template-columns:1fr 270px;gap:14px;align-items:start}
@media(max-width:720px){.layout{grid-template-columns:1fr}}
.mp{display:inline-block;background:var(--soft);color:var(--p);font-weight:700;font-size:.8rem;padding:3px 10px;border-radius:99px}
.qt{font-size:1.05rem;margin:10px 0;overflow-x:auto}
.op{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border:2px solid var(--bd);border-radius:12px;margin:8px 0;cursor:pointer}
.op b{background:var(--soft);color:var(--p);width:28px;height:28px;border-radius:50%;display:grid;place-items:center;flex:none}
.op span{overflow-x:auto;max-width:100%}
.op.sel{border-color:var(--p);background:var(--soft)}.op.sel b{background:var(--p);color:#fff}
.nav{display:flex;gap:8px;justify-content:space-between;flex-wrap:wrap;margin-top:12px}
.grid{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.n{aspect-ratio:1;border-radius:9px;border:2px solid transparent;background:var(--gr);color:var(--tx);font-weight:700;padding:0;font-size:.85rem}
.n.a{background:var(--ok);color:#fff}.n.r{background:var(--rg);color:#2b1d00}.n.c{border-color:var(--p);box-shadow:0 0 0 3px var(--soft)}
.lg{display:flex;flex-wrap:wrap;gap:8px 12px;font-size:.8rem;color:var(--mu);margin-top:12px}.lg i{display:inline-block;width:12px;height:12px;border-radius:4px;margin-right:4px;vertical-align:-1px}
.big{font-size:3.4rem;font-weight:800;background:linear-gradient(135deg,var(--p),var(--p2));-webkit-background-clip:text;background-clip:text;color:transparent;line-height:1.1}
.id{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;text-align:left;max-width:440px;margin:12px auto}.id span{color:var(--mu)}
.st{display:grid;grid-template-columns:repeat(auto-fit,minmax(100px,1fr));gap:8px;margin-top:10px}.st div{background:var(--soft);border-radius:12px;padding:10px;text-align:center}.st b{display:block;font-size:1.3rem;color:var(--p)}
.pb{border-left:5px solid var(--gr);padding-left:12px;margin:16px 0}.pb.ok{border-color:var(--ok)}.pb.no{border-color:var(--no)}.pb.kos{border-color:var(--rg)}
.tag{font-weight:700}.ok .tag{color:var(--ok)}.no .tag{color:var(--no)}.kos .tag{color:var(--rg)}
.ex{background:var(--soft);border-radius:10px;padding:10px;margin-top:6px;overflow-x:auto}
.mu{color:var(--mu)}.err{color:var(--no);font-weight:600}
.ov{position:fixed;inset:0;background:rgba(10,12,30,.8);display:grid;place-items:center;padding:16px;z-index:20}.ov .card{max-width:440px;margin:0}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}
mjx-container{max-width:100%;overflow-x:auto;overflow-y:hidden}
</style>

mudah dikendalikan.", "Jenis passing dalam bola basket: chest pass, bounce pass, overhead pass, dan baseball pass. Opsi C memuat keempatnya dengan penulisan yang benar.", "Pada passing bawah bola harus mengenai bidang datar lengan bawah yang rapat dan lebih luas, bukan kepalan atau lengan atas. Soal ini perlu diverifikasi guru.", "Umpan pendek yang baik dikirim rata dengan tanah (mendatar) agar mudah dikontrol dan dikuasai rekan.", "Ketentuan dribble yang benar: bola dipantulkan dengan satu tangan bergantian, rendah, bisa di tempat atau sambil bergerak. Mendribble dengan dua tangan bersamaan berulang-ulang adalah pelanggaran (double dribble), jadi itu pengecualiannya.", "Libero adalah pemain bertahan yang bebas bertukar posisi (menggantikan pemain belakang) tanpa dihitung sebagai pergantian pemain.", "Anton berada lebih dekat ke garis gawang lawan daripada bola dan pemain kedua terakhir lawan saat menerima umpan, yaitu pelanggaran offside.", "Kontak keras saat melakukan tembakan membuat wasit memberi lemparan bebas (free throw). Pada soal, wasit memberi dua kali kesempatan tembakan tanpa gangguan, yaitu free throw.", "Isyarat wasit pada gambar (lengan terulur) adalah isyarat pelanggaran tiga detik (three second) di area terlarang. Soal ini perlu diverifikasi guru.", "Skor 24–22 lalu XII MS 2 menambah dua poin menjadi 24–24 (deuce). Set dimenangkan dengan selisih 2 poin, sehingga XII MS 2 harus mencapai 26 saat XII MS 1 tetap 24.", "Teknik menangkap bola yang dilemparkan lawan dalam softball disebut catching.", "Pukulan yang menjatuhkan kok sangat dekat net saat lawan berada di belakang lapangan adalah drop shot.", "Menurut kunci resmi, pegangan bet pada gambar adalah Seemiller grip.", "Menjatuhkan badan ke belakang sambil mengayunkan satu kaki ke arah base untuk menyentuh base disebut sliding.", "Pukulan drive pada bulu tangkis berjalan mendatar (sejajar net) dengan kecepatan tinggi.", "Memutar pergelangan tangan sehingga bola berputar cepat (efek putaran kuat) adal
